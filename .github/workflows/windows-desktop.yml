name: Build Windows Desktop

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Windows package
        run: npm run desktop:build:win

      - name: Prepare download names
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path download-site/downloads | Out-Null
          $setup = Get-ChildItem release -Filter "ATCConfMaker-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Windows installer .exe was not created." }
          $portable = Get-ChildItem release -Filter "ATCConfMaker-portable-*.exe" | Select-Object -First 1
          if (-not $portable) { throw "Windows portable .exe was not created." }
          Copy-Item $portable.FullName download-site/downloads/ATCConfMaker-windows.exe -Force
          Copy-Item $setup.FullName download-site/downloads/ATCConfMaker-windows-setup.exe -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atcconfmaker-windows
          if-no-files-found: error
          compression-level: 0
          path: |
            download-site/downloads/ATCConfMaker-windows.exe
            download-site/downloads/ATCConfMaker-windows-setup.exe
