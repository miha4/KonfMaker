name: Build Windows Desktop

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:build:win:setup

      - name: Audit locked JavaScript dependencies
        run: |
          npm audit --audit-level=low
          npm --prefix frontend audit --audit-level=low

      - name: Audit locked Python dependencies
        shell: pwsh
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r backend/requirements-desktop-build.txt

      - name: Prepare download names
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path download-site/downloads | Out-Null
          $setup = Get-Item release/ATCConfMakerSetup.exe -ErrorAction SilentlyContinue
          if (-not $setup) { throw "ATCConfMakerSetup.exe was not created." }
          Copy-Item $setup.FullName download-site/downloads/ATCConfMakerSetup.exe -Force
          Copy-Item docs/ATCConfMaker-security.md download-site/downloads/ATCConfMaker-security.md -Force

          $installedRoot = Join-Path $PWD "release/win-unpacked"
          if (-not (Test-Path $installedRoot)) { throw "Unpacked application was not created." }
          $manifestPath = Join-Path $PWD "download-site/downloads/ATCConfMakerSetup-SHA256.txt"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lines = @(
            "# ATCConfMaker Windows setup build $version",
            "# SHA-256 manifest for the installer and every installed application payload file",
            "# Generated by GitHub Actions; paths under APP/ are relative to the installation directory.",
            ""
          )
          $installerHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines += "$installerHash  INSTALLER/ATCConfMakerSetup.exe"
          Get-ChildItem $installedRoot -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $relative = [IO.Path]::GetRelativePath($installedRoot, $_.FullName) -replace '\\', '/'
              $lines += "$hash  APP/$relative"
            }
          $lines | Set-Content $manifestPath -Encoding utf8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atcconfmaker-windows
          if-no-files-found: error
          compression-level: 0
          path: |
            download-site/downloads/ATCConfMakerSetup.exe
            download-site/downloads/ATCConfMakerSetup-SHA256.txt
            download-site/downloads/ATCConfMaker-security.md
